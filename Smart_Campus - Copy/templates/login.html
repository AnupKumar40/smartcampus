<!DOCTYPE html>
<html>
<head>

<title>AMITY7ONE Login</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;

    background:
        linear-gradient(
            135deg,
            #185f87,
            #f5b900
        );

    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;
}

.container {

    width: 1200px;
    height: 700px;

    background: rgba(255,255,255,0.72);

    border-radius: 18px;

    padding: 45px 70px;

    display: flex;

    gap: 100px;

    box-shadow: 0 10px 40px rgba(0,0,0,0.25);
}


/* LEFT */

.left {

    width: 50%;
}

.logo {

    font-size: 58px;

    font-weight: bold;

    color: #07529b;

    margin-bottom: 40px;
}

.logo span {

    color: #f3f3f3;

    text-shadow:
        2px 2px 5px #555;
}

.poster {

    height: 485px;

    border-radius: 12px;

    background:
        linear-gradient(
            145deg,
            #02045c,
            #172db8,
            #05076b
        );

    color: white;

    padding: 55px 35px;

    text-align: center;

    box-shadow: 0 5px 15px rgba(0,0,0,.3);
}

.poster h1 {

    font-size: 42px;

    color: #ffd000;

    margin: 15px 0;
}

.poster h2 {

    font-size: 34px;

    margin: 10px;
}

.poster p {

    font-size: 23px;

    line-height: 1.5;
}


/* RIGHT */

.login {

    width: 50%;

    padding-top: 120px;
}

.login-title {

    font-size: 38px;

    font-weight: bold;

    color: #40b63d;

    margin-bottom: 10px;
}

.login-title span {

    color: #0c477e;

    font-size: 25px;
}

.admin {
    text-align: center;
    margin-bottom: 25px;
}

.admin a {
    color: #07529b;
    text-decoration: none;
    font-weight: bold;
    font-size: 15px;
    padding: 8px 18px;
    border-radius: 20px;
    background: #eaf1fa;
    border: 1px solid #c2d7f3;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s ease;
}

.admin a:hover {
    background: #07529b;
    color: white;
    box-shadow: 0 4px 12px rgba(7, 82, 155, 0.25);
    transform: translateY(-1px);
}

input {

    width: 100%;

    padding: 18px;

    margin-bottom: 15px;

    border: none;

    border-radius: 35px;

    background: #e4ecfb;

    font-size: 17px;

    outline: none;
}

button {

    width: 100%;

    padding: 18px;

    border: none;

    border-radius: 35px;

    background: #4bc13c;

    color: white;

    font-size: 22px;

    font-weight: bold;

    cursor: pointer;
}

button:hover {

    background: #36a92e;
}

.forgot {

    text-align: center;

    margin-top: 10px;

    color: #777;
}

.error {

    background: #ffdddd;

    color: red;

    padding: 10px;

    border-radius: 10px;

    text-align: center;

    margin-bottom: 15px;
}

</style>

</head>

<body>

<div class="container">

    <div class="left">

        <div class="logo">
            <span>AMI</span>7ONE
        </div>

        <div class="poster">

            <h2>AMITY7ONE</h2>

            <h1>SMART CAMPUS</h1>

            <p>
                Student Performance
                &
                Placement Management
            </p>

            <p>
                Academic information
                in one place.
            </p>

        </div>

    </div>


    <div class="login">

        <div class="login-title">
            LOGIN
            <span>STUDENT | PARENT</span>
        </div>

        <div class="admin">
            <a href="/admin/login">
                <span>🔒 Click here for Admin Login &rarr;</span>
            </a>
        </div>

        {% if error %}
        <div class="error">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">

            <input
                type="text"
                name="student_id"
                placeholder="Student ID / Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                STUDENT LOGIN
            </button>

        </form>

    </div>

</div>

</body>
</html>
